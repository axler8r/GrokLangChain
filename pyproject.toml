[project]
name = "BiblioQuiz"
version = "0.1.0"
description = "Search your eBooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "application/agent",
    "application/loader",
    "application/historian",
    "application/librarian",
    "share",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "B"]
exclude = [
    "__pycache__",
    ".venv",
]

[tool.ruff.lint.isort]
known-first-party = ["biblioquiz"]

[tool.pytest.ini_options]
testpaths = ["application/*/test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]
