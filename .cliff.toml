[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true


[changelog]
trim = true
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }}
    **{{ timestamp | date(format="%Y-%m-%d") }}**
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | unique(attribute="message") | filter(attribute="merge_commit") | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        + {% if commit.breaking %}**!!** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n

"""
footer = """
"""
postprocessors = []


[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  # increment major version
  { message = "^feat!",           group = "<!--0-->Breaking Changes" },
  { message = "^feat: retire",    group = "<!--0-->Breaking Changes" },
  { message = "^feat: add",       group = "<!--0-->Added" },
  # increment minor version
  { message = "^env: add",        group = "<!--0-->Added" },
  { message = "^feat: deprecate", group = "<!--1-->Deprecated" },
  { message = "^feat: update",    group = "<!--1-->Changed" },
  { message = "^env: update",     group = "<!--1-->Changed" },
  { message = "^fix.*",           group = "<!--1-->Fixed" },
  # increment patch version
  { message = "^hotfix.*",        group = "<!--2-->Patched" },
  # ignore
  { message = ".*",               skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta)\\.[1-9]+[0-9]*$)?"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
