services:
  archivist:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  loader:
    build:
      context: ./application/loader
    volumes:
      - ./application/loader:/app
      - ./share:/share
      - ./data:/data
    environment:
      - PYTHONPATH=/app:/share
      - PDF_PATH=${PDF_PATH:-/data/book}
    restart: unless-stopped
    depends_on:
      - archivist
      - mongo

  historian:
    build:
      context: ./application/historian
    volumes:
      - ./application/historian:/app
      - ./share:/share
    environment:
      - PYTHONPATH=/app:/share
    command: python main.py
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db

  librarian:
    build:
      context: ./application/librarian
    volumes:
      - ./application/librarian:/app
      - ./share:/share
    environment:
      - PYTHONPATH=/app:/share
    command: streamlit run main.py --server.port=8501
    ports:
      - "8501:8501"
